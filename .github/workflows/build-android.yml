name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch Persian fonts
        run: python3 scripts/fetch_fonts.py
      - name: Generate Android platform
        run: flutter create --platforms=android --project-name=iranrobot_invoice --org=ir.iranrobot .
      - name: Remove Flutter-generated template test
        run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: IranRobot-Invoice-APK
          path: build/app/outputs/flutter-apk/app-release.apk
